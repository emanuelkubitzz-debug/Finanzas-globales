
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor de Monedas Internacionales</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="converter-container">
    <h2>Cambio de Moneda</h2>
    
    <form id="currency-form">
      <div class="input-group">
        <label for="amount">Monto a convertir:</label>
        <input type="number" id="amount" placeholder="Ej: 100" step="0.01" min="0.01" required>
      </div>

      <div class="select-group">
        <div class="field">
          <label for="from">De:</label>
          <select id="from" required>
            <option value="USD">USD - Dólar Estadounidense</option>
            <option value="EUR">EUR - Euro</option>
            <option value="ARS">ARS - Peso Argentino</option>
            <option value="BRL">BRL - Real Brasileño</option>
            <option value="MXN">MXN - Peso Mexicano</option>
          </select>
        </div>

        <div class="field">
          <label for="to">A:</label>
          <select id="to" required>
            <option value="EUR">EUR - Euro</option>
            <option value="USD">USD - Dólar Estadounidense</option>
            <option value="ARS">ARS - Peso Argentino</option>
            <option value="BRL">BRL - Real Brasileño</option>
            <option value="MXN">MXN - Peso Mexicano</option>
          </select>
        </div>
      </div>

      <button type="submit" id="convert-btn">Convertir</button>
    </form>

    <div id="result-box" class="result-box hidden">
      <p class="conversion-text">Resultado:</p>
      <h3 id="converted-amount">$0.00</h3>
      <span id="applied-rate" class="rate-info">Tasa de cambio: -</span>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
